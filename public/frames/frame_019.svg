<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
    <defs>
      <!-- Core Dark Studio Background Gradient -->
      <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
        <stop offset="70%" stop-color="#050505" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
      </radialGradient>

      <!-- Realistic Metallic Chrome Specular Gradient -->
      <radialGradient id="chromeBall" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="18%" stop-color="#e2e8f0"/>
        <stop offset="45%" stop-color="#334155"/>
        <stop offset="85%" stop-color="#090d16"/>
        <stop offset="100%" stop-color="#020408"/>
      </radialGradient>

      <!-- Neon Cyan-Emerald Rim Light -->
      <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
        <stop offset="50%" stop-color="#10b981" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#059669" stop-opacity="0.9"/>
      </linearGradient>
    </defs>

    <rect width="100%" height="100%" fill="url(#bgGlow)"/>

    <!-- Dynamic 3D Orbit Track Outer -->
    <ellipse cx="300" cy="300" rx="59.4" ry="180" 
             fill="none" stroke="url(#rimGlow)" stroke-width="2.5" 
             stroke-dasharray="6, 8"
             transform="rotate(108.0 300 300)"/>

    <!-- Central 3D Metallic Sphere -->
    <circle cx="300" cy="300" r="110" fill="url(#chromeBall)"/>

    <!-- Studio Reflection Ring Intersect -->
    <ellipse cx="300" cy="300" rx="112" ry="109.6" 
             fill="none" stroke="#10b981" stroke-width="3" opacity="0.85"
             transform="rotate(-108.0 300 300)"/>

    <!-- Light Specular Glare Target -->
    <ellipse cx="262.8" cy="226.2" rx="35" ry="20" 
             fill="#ffffff" opacity="0.35" transform="rotate(-25 300 300)"/>
  </svg>